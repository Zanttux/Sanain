name: Bug report
description: Report a reproducible problem
labels: [bug, needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: Sanain version and OS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual behavior
      description: Use synthetic files. Never include secrets or private data.
    validations:
      required: true
