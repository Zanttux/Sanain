name: Website

# Publishes website/ (plus the screenshots and icon from docs/ and assets/)
# to GitHub Pages: https://zanttux.github.io/Sanain/
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/screenshots/**
      - assets/brand/icon.svg
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          python3 website/build.py
          mkdir -p _site/screenshots _site/fi
          cp website/index.html website/style.css _site/
          cp website/fi/index.html _site/fi/
          cp assets/brand/icon.svg _site/icon.svg
          cp docs/screenshots/editor.png docs/screenshots/markdown.png docs/screenshots/split.png docs/screenshots/log.png _site/screenshots/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
