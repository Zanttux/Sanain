name: Package

# Builds archives on Linux, Windows and macOS. Every push to main replaces
# the "nightly" pre-release; a v* tag creates a pre-release for that
# version (owner decision D23, docs/RELEASE.md). Pull requests build
# unsigned; pushes also build a signed and notarized macOS package (D28),
# which is the one published. Windows signing follows (#174).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  # Keep the packaging itself tested when it changes.
  pull_request:
    paths:
      - scripts/package.py
      - scripts/macos-bundle.sh
      - scripts/third-party-notices.py
      - packaging/**
      - .github/workflows/package.yml

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: binaries built here need only an older
          # glibc, so they run on more distributions.
          - os: ubuntu-22.04
            python: python3
          - os: windows-latest
            python: python
          - os: macos-latest
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: ${{ matrix.python }} scripts/package.py
      # Lightness: downloads must stay within bench/budgets.json (#179).
      - run: ${{ matrix.python }} scripts/bench/size-check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text3-${{ matrix.os }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14

  # Signed and notarized macOS build (#174, D28). The only job with the
  # signing secrets: environment "signing" is limited to main and v* tags,
  # so pull requests and forks never reach it (docs/SECURITY_SECRETS.md).
  package-macos-signed:
    name: package (macOS, signed)
    if: github.event_name == 'push' && github.repository == 'Zanttux/text3'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Temporary keychain and notary key
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu
          umask 077
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp=$(openssl rand -hex 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # By SHA-1 fingerprint: a name can match several certificates.
          id=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$id"
          echo "TEXT3_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple
        env:
          TEXT3_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          TEXT3_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          TEXT3_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 scripts/package.py
      - name: Check the signature and the ticket
        run: |
          set -eu
          cd target/dist
          dmg=$(ls *.dmg)
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          spctl -a -vv "$mnt/Text³.app"
          hdiutil detach "$mnt" -quiet
      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text3-macos-signed
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14

  # Privileged job, separate from the builds; runs only for pushes to this
  # repository (never for pull requests).
  publish:
    name: publish
    needs: [package, package-macos-signed]
    if: github.event_name == 'push' && github.repository == 'Zanttux/text3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Linux and Windows from the builds, macOS from the signed job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: text3-ubuntu-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: text3-windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: text3-macos-signed
          path: dist
      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ls -l dist
          cat dist/*.sha256 > dist/SHA256SUMS
          notes="Development build of Text³ from commit ${SHA}.
          macOS: signed with Developer ID and notarized by Apple; opens
          normally. Windows and Linux: not signed yet (Windows SmartScreen
          may warn). Checksums in SHA256SUMS. Machine translations are
          unreviewed. See CHANGELOG.md."
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"; title="Text³ $REF_NAME (pre-release)"
          else
            tag=nightly; title="Text³ nightly"
            gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          fi
          gh release create "$tag" dist/* --repo "$REPO" --target "$SHA" \
            --prerelease --title "$title" --notes "$notes"
