name: Package

# Builds unsigned archives on Linux, Windows and macOS. Every push to main
# replaces the "nightly" pre-release; a v* tag creates a pre-release for
# that version (owner decision D23, docs/RELEASE.md). Unsigned until
# signing certificates exist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  # Keep the packaging itself tested when it changes.
  pull_request:
    paths:
      - scripts/package.py
      - scripts/macos-bundle.sh
      - scripts/third-party-notices.py
      - packaging/**
      - .github/workflows/package.yml

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: binaries built here need only an older
          # glibc, so they run on more distributions.
          - os: ubuntu-22.04
            python: python3
          - os: windows-latest
            python: python
          - os: macos-latest
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: ${{ matrix.python }} scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text3-${{ matrix.os }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14

  # Privileged job, separate from the builds; runs only for pushes to this
  # repository (never for pull requests).
  publish:
    name: publish
    needs: package
    if: github.event_name == 'push' && github.repository == 'Zanttux/text3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ls -l dist
          cat dist/*.sha256 > dist/SHA256SUMS
          notes="Unsigned development build of Text³ from commit ${SHA}.
          Not signed or notarized: macOS asks for confirmation on first open
          (right-click > Open), Windows SmartScreen may warn. Checksums in
          SHA256SUMS. Machine translations are unreviewed. See CHANGELOG.md."
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"; title="Text³ $REF_NAME (unsigned pre-release)"
          else
            tag=nightly; title="Text³ nightly (unsigned)"
            gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          fi
          gh release create "$tag" dist/* --repo "$REPO" --target "$SHA" \
            --prerelease --title "$title" --notes "$notes"
