[package]
name = "sanain-platform"
description = "Small, audited operating-system shims for Sanain (ADR 0003)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSString", "NSURL", "NSObject", "NSNotification", "objc2-core-services"] }

# Same as the workspace lints, except that unsafe code is denied rather
# than forbidden, so the audited blocks below can allow it one by one.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
