[package]
name = "sanain-app"
description = "The Sanain desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sanain"
path = "src/main.rs"

[dependencies]
sanain-core = { path = "../sanain-core" }
sanain-io = { path = "../sanain-io" }
sanain-i18n = { path = "../sanain-i18n" }
sanain-language = { path = "../sanain-language" }
sanain-markdown = { path = "../sanain-markdown" }
sanain-tools = { path = "../sanain-tools" }
ropey.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "links", "default_fonts", "system_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.18"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
egui_extras = { version = "0.37", default-features = false }
arboard = { version = "3.7", default-features = false }
sys-locale = "0.3"
# System font list for the editor font setting (no memory mapping).
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "fontconfig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.22", default-features = false }

[dev-dependencies]
encoding_rs = "0.8.44"
tempfile.workspace = true

[lints]
workspace = true
