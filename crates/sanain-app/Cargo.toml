[package]
name = "sanain-app"
description = "The Sanain desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sanain"
path = "src/main.rs"

[dependencies]
sanain-core = { path = "../sanain-core" }
sanain-io = { path = "../sanain-io" }
sanain-i18n = { path = "../sanain-i18n" }
ropey.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "system_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.18"
sys-locale = "0.3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
